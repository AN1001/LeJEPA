[project]
name = "lejepa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch==2.2.2;        sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2;             sys_platform == 'darwin' and platform_machine == 'x86_64'",

    "torch>=2.2;          sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.17;   sys_platform != 'darwin' or platform_machine != 'x86_64'",

    "datasets>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lejepa"]
exclude = ["data/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["N", "E501", "F841", "B007", "E401", "SIM115", "F401"]
"lejepa/ViT.py" = ["N803", "N806", "N812", "N999"]
"lejepa/metrics.py" = ["N812"]
